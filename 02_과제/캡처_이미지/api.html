<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>BidBox API</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;background:#fff;font-family:"Apple SD Gothic Neo",sans-serif;color:#0f1b33;padding:26px 36px}
h2{font-size:26px;font-weight:800}h2 span{color:#1d63e0}

<div class="grid">
 <div class="p"><h3><b>①</b> API 그룹 구성</h3><img src="api_overview.jpg">

   <div class="g"><b>Evaluations</b>적격심사 분석·추천·규칙</div>

  </div></div>
 <div class="p"><h3><b>②</b> Evaluations: 적격심사 정량평가 분석, 투찰가 추천, 별표 규칙 목록</h3><img src="api_eval.jpg"></div>
